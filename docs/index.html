<!doctype html>
<html lang="zh-Hant">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14111b">
 <meta name="description" content="歌荒救星，找到與此刻心情同頻的獨立音樂，閱讀專屬樂評，創作想像中的唱片封面。">
 <title>歌荒救星 — Indie Music Savior</title>
 <link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script>
</head>
<body>
 <div class="ambient glow-a" aria-hidden="true"></div><div class="ambient glow-b" aria-hidden="true"></div>
 <div class="shell">
  <header class="topbar"><a class="logo" href="#top"><span class="mini-vinyl" aria-hidden="true"></span><span>歌荒救星<small>INDIE MUSIC SAVIOR</small></span></a><span class="tiny-status" id="connection-status">連線中…</span></header>
  <main id="top">
   <section class="hero">
    <h1>讓一首歌，<br><em>接住此刻的你。</em></h1><p class="intro">有些情緒很難命名。留下一段心情，<br>找到與你同頻的獨立音樂。</p>
    <div class="searchbox"><div class="input-heading"><label for="mood-text">描述你現在的心情</label><span id="char-count">0 / 220</span></div><textarea id="mood-text" maxlength="220" rows="3" placeholder="陰天下午，想聽有點憂傷、帶著模糊吉他破音的 Lo-fi 搖滾……"></textarea>
     <div class="chips" aria-label="範例心情"><button type="button" data-mood="陰天下午有點憂傷，想聽模糊破音吉他和 Lo-fi 獨立搖滾">☁ 陰天的低潮</button><button type="button" data-mood="週末早晨喝咖啡，想聽舒服放鬆的 dream pop">☕ 慢速週末</button><button type="button" data-mood="今天很有活力，想聽快節奏、充滿鼓點的獨立搖滾">⚡ 想動起來</button><button type="button" data-mood="下班的傍晚有點懷舊，想聽浪漫溫暖的 indie pop">🌆 城市黃昏</button></div>
     <div class="actions"><button id="recommend-btn" class="primary" type="button" disabled>依心情找歌 <span aria-hidden="true">↗</span></button><button id="random-btn" class="secondary" type="button" disabled>⤨ 隨機抽歌</button></div>
     <p id="feedback" role="status" aria-live="polite" class="feedback"></p>
    </div><p class="hero-stats"><strong id="library-count">—</strong> 首獨立音樂，等你發現。</p>
   </section>
   <section class="result" id="results" hidden aria-labelledby="song-name">
    <div class="result-grid"><div class="left-result">
      <div id="cover" class="cover" aria-label="專屬唱片封面"><img id="cover-ai-image" class="cover-ai-image" alt="AI 生成的原創唱片封面" hidden><div class="cover-placeholder"><div class="record" aria-hidden="true"><div class="record-center"><div class="record-hole"></div></div></div><span></span></div></div>
      <div class="cover-controls"><button id="generate-cover" type="button" class="small-primary" disabled>✦ 生成專屬封面</button><a id="download-cover" class="small-outline" href="#" download="indie-original-cover.jpg" hidden>↓ 下載封面</a></div>
      <p class="cover-caption" id="cover-image-status" role="status" aria-live="polite"></p><p class="cover-caption" id="cover-caption" hidden>AI 原創設計，非官方唱片封面。</p>
     </div><div class="right-result"><div class="result-kicker"><span>為你選的一首歌</span><span id="score"></span></div><h2 id="song-name">—</h2><p class="artist" id="artist">—</p><div class="tags" id="tags"></div>
      <article class="review"><div class="block-heading"><span id="review-heading">微型樂評</span><span id="review-source"></span></div><p id="review-text"></p></article>
      <article class="reason"><h3>選歌理由</h3><p id="reason-text"></p></article>
      <div class="song-actions"><button id="again-btn" type="button" class="small-primary" disabled>⤨ 再推薦一首</button><a id="youtube-link" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" class="small-outline">↗ 在 YouTube 開啟</a></div><p id="result-message" class="cover-caption" role="status"></p>
    </div></div>
    <div class="player-section"><h3 class="section-title">聆聽這首歌</h3><div id="player" class="player"></div><p class="player-hint">若無法播放，可直接在 YouTube 開啟。</p></div>
    <details class="prompt-panel"><summary>創作細節</summary><div class="analysis-area"><h3>情緒與歌曲標籤</h3><div id="analysis-tags" class="tag-board"></div><p id="analysis-explanation" class="analysis-explanation"></p></div><div class="prompt-top"><h3>封面提示詞</h3><button id="copy-prompt" class="copy-btn" type="button">複製</button></div><p id="prompt-text" class="prompt-text"></p></details>
   </section>
  </main><footer><span>© 2026 歌荒救星</span><span>INDIE MUSIC SAVIOR</span></footer>
 </div>
</body></html>
